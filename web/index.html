<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAgent</title>
<!-- Stylesheets first: tokens, then the shell frame, then one file per component.
     Every URL carries the release stamp so no cache layer can serve an older file. -->
<link rel="stylesheet" href="./shell/tokens.css?v=2026-11-26g">
<link rel="stylesheet" href="./shell/shell.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/badge/badge.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/button/button.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/card/card.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/elevation/elevation.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/grid/grid.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/list/list.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/stat/stat.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/stack/stack.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/tile/tile.css?v=2026-11-26g">
<link rel="stylesheet" href="./chat/chat.css?v=2026-11-26g">
<link rel="stylesheet" href="./chat/composer/composer.css?v=2026-11-26g">
<link rel="stylesheet" href="./components/refresh/refresh.css?v=2026-11-26g">
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Navigation">
    <div class="sidebar-top">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 12a8 8 0 0 1 16 0M4 12a8 8 0 0 0 16 0M8 12h8"/>
          </svg>
        </span>
        <span class="brand-name">WebAgent</span>
      </span>
      <button type="button" id="sidebar-toggle" class="icon-button" aria-label="Collapse sidebar" aria-expanded="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
    </div>
    <nav id="sidebar-nav" class="sidebar-scroll" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <button type="button" id="account-button" class="account-button">
        <span class="account-avatar" aria-hidden="true">A</span>
        <span class="account-text">
          <span class="account-name" id="account-name">Loading…</span>
          <span class="account-role" id="account-role">Manage account</span>
        </span>
        <span class="account-chev" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </button>
      <button type="button" id="theme-toggle" class="nav-item" aria-label="Toggle light and dark theme" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
        </svg>
        <span class="nav-label">Light / dark</span>
      </button>
    </div>
  </aside>

  <div class="shell-body">
  <main id="content" class="content">
    <header class="content-head">
      <button type="button" id="menu-open" class="icon-button" aria-label="Open menu" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <h1 id="page-title">Sessions</h1>
      <span class="content-head-note" id="page-note"></span>
      <button type="button" id="refresh-button" class="icon-button" hidden title="Clear browser data and reload (stay signed in)" aria-label="Clear browser data and reload">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/>
          <path d="M20.5 4.5V11H14"/>
        </svg>
      </button>
      <button type="button" id="chat-switch" class="icon-button" aria-label="Open chat" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11.5a8 8 0 0 1-8.2 8 8.6 8.6 0 0 1-3.5-.7L4 20l1.3-4a8 8 0 0 1-1.3-4.4A8 8 0 0 1 12 3.5a8 8 0 0 1 8 8z"/>
        </svg>
      </button>
    </header>
    <div class="content-body" id="page-body"></div>
  </main>
  <div id="chat-divider" role="separator" aria-orientation="vertical" aria-label="Resize chat" tabindex="0"></div>
  <aside id="chat-panel" aria-label="Chat"></aside>
  </div>
</div>
<div id="sidebar-backdrop" aria-hidden="true"></div>
<!-- Pull-to-refresh indicator: the soft arc fills first, the hard arc past the hard pull. -->
<div id="ptr-indicator" hidden aria-live="polite" aria-label="Pull to refresh">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <path id="ptr-soft" class="ptr-arc ptr-arc-soft" d="M24,7 A17,17 0 1,1 10.3,15.3 L15.5,10.5" stroke-dasharray="98" stroke-dashoffset="98"/>
    <path id="ptr-hard" class="ptr-arc ptr-arc-hard" d="M24,7 A17,17 0 1,1 10.3,15.3 L15.5,10.5" stroke-dasharray="98" stroke-dashoffset="98" style="display:none"/>
  </svg>
  <span id="ptr-hint" class="ptr-hint"></span>
</div>
<script type="module" src="./shell/shell.js?v=2026-11-26g"></script>
</body>
</html>
