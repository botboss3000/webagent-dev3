<!-- Chat shell, ported from ui/chat/chat.html: the panel frame plus its three
     regions. The header and footer are deliberately empty in this release and
     the transcript is empty too; each region is filled component by component.
     No scripts live here (CSP), chat.js mounts this file. -->
<div id="chat-panel" class="chat-panel">
  <header id="chat-header" class="chat-header" aria-label="Chat header"></header>
  <div id="chat-messages" class="chat-messages" tabindex="0">
    <div id="chat-messages-inner" class="chat-messages-inner"></div>
  </div>
  <footer id="chat-footer" class="chat-footer" aria-label="Chat footer"></footer>
</div>
