[package]
name = "webagent-automation-ability"
version = "1.0.0"
edition = "2021"

[workspace]

[[bin]]
name = "webagent_automation"
path = "service/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
