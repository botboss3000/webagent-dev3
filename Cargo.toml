[package]
name = "webagent-v3"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/context-contracts", "crates/context-assembly", "crates/context-service", "crates/background-contracts", "crates/background-dispatch", "crates/engine-service", "crates/background-service"]
default-members = [".", "crates/context-contracts", "crates/context-assembly", "crates/context-service", "crates/background-contracts", "crates/background-dispatch", "crates/engine-service", "crates/background-service"]
resolver = "2"

[features]
default = ["linked-context"]
linked-context = ["dep:webagent-context-assembly", "dep:webagent-background-dispatch"]
live-context = []

[dependencies]
webagent-background-contracts={path="crates/background-contracts"}
webagent-background-dispatch={path="crates/background-dispatch",optional=true}
webagent-context-contracts = {path="crates/context-contracts"}
webagent-context-assembly = {path="crates/context-assembly",optional=true}
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Already locked through reqwest; decode bounded private PNG artifacts.
base64 = "=0.22.1"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[dev-dependencies]
webagent-background-dispatch={path="crates/background-dispatch"}
webagent-context-assembly = {path="crates/context-assembly"}
http-body-util = "0.1"

[[bin]]
name = "webagent-mcp"
path = "src/plugin_packages/mcp/main.rs"

[[bin]]
name = "webagent-diagnostics"
path = "src/plugin_packages/diagnostics/main.rs"

[[bin]]
name = "webagent-optimization"
path = "src/plugin_packages/optimization/main.rs"

[[bin]]
name = "webagent-automation"
path = "src/plugin_packages/automation/main.rs"

[[bin]]
name = "webagent-outbound-notifications"
path = "src/plugin_packages/outbound_notifications/main.rs"
