[package]
name = "webagent-v3"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/modules/agents", "crates/modules/accounts", "crates/modules/webapp", "crates/modules/abilities", "crates/modules/access", "crates/modules/configuration", "crates/modules/system", "crates/modules/context", "crates/modules/engine", "crates/modules/manager", "crates/modules/chat", "crates/modules/models", "crates/modules/usage", "crates/modules/files", "crates/context-contracts", "crates/context-assembly", "crates/context-service", "crates/background-contracts", "crates/background-dispatch", "crates/engine-service", "crates/background-service", "crates/boot-contracts", "crates/boot-supervisor", "crates/boot-service", "crates/assets-contracts", "crates/context-assets", "crates/assets-service", "crates/capability-contracts", "crates/capability-context", "crates/capability-service", "crates/provider-contracts", "crates/provider-projection", "crates/provider-service", "src/plugin_packages/diagnostics"]
default-members = ["crates/modules/agents", "crates/modules/accounts", "crates/modules/webapp", "crates/modules/abilities", "crates/modules/access", "crates/modules/configuration", "crates/modules/system", "crates/modules/context", "crates/modules/engine", "crates/modules/manager", "crates/modules/chat", "crates/modules/models", "crates/modules/usage", "crates/modules/files", ".", "crates/context-contracts", "crates/context-assembly", "crates/context-service", "crates/background-contracts", "crates/background-dispatch", "crates/engine-service", "crates/background-service", "crates/boot-contracts", "crates/boot-supervisor", "crates/boot-service", "crates/assets-contracts", "crates/context-assets", "crates/assets-service", "crates/capability-contracts", "crates/capability-context", "crates/capability-service", "crates/provider-contracts", "crates/provider-projection", "crates/provider-service", "src/plugin_packages/diagnostics"]
resolver = "2"

[features]
default = ["linked-context"]
linked-context = ["webagent-engine/linked-context", "dep:webagent-context-assembly", "dep:webagent-background-dispatch", "dep:webagent-boot-supervisor", "dep:webagent-context-assets", "dep:webagent-capability-context", "dep:webagent-provider-projection"]
live-context = ["webagent-engine/live-context"]

[dependencies]
webagent-agents = { path = "crates/modules/agents" }
webagent-accounts = { path = "crates/modules/accounts" }
webagent-webapp = { path = "crates/modules/webapp" }
webagent-abilities = { path = "crates/modules/abilities" }
webagent-access = { path = "crates/modules/access" }
webagent-configuration = { path = "crates/modules/configuration" }
webagent-system = { path = "crates/modules/system" }
webagent-diagnostics = { path = "src/plugin_packages/diagnostics" }
webagent-engine = { path = "crates/modules/engine", default-features = false }
webagent-manager = { path = "crates/modules/manager" }
webagent-chat = { path = "crates/modules/chat" }
webagent-models = { path = "crates/modules/models" }
webagent-usage = { path = "crates/modules/usage" }
webagent-files = { path = "crates/modules/files" }
webagent-assets-contracts={path="crates/assets-contracts"}
webagent-capability-contracts={path="crates/capability-contracts"}
webagent-provider-contracts={path="crates/provider-contracts"}
webagent-context-assets={path="crates/context-assets",optional=true}
webagent-capability-context={path="crates/capability-context",optional=true}
webagent-provider-projection={path="crates/provider-projection",optional=true}
webagent-boot-contracts={path="crates/boot-contracts"}
webagent-boot-supervisor={path="crates/boot-supervisor",optional=true}
webagent-background-contracts={path="crates/background-contracts"}
webagent-background-dispatch={path="crates/background-dispatch",optional=true}
webagent-context-contracts = {path="crates/context-contracts"}
webagent-context-assembly = {path="crates/context-assembly",optional=true}
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Already locked through reqwest; decode bounded private PNG artifacts.
base64 = "=0.22.1"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[dev-dependencies]
webagent-abilities = { path = "crates/modules/abilities", features=["test-support"] }
webagent-diagnostics = { path = "src/plugin_packages/diagnostics", features = ["test-support"] }
webagent-engine = { path="crates/modules/engine", default-features=false, features=["test-support"] }
webagent-models = { path = "crates/modules/models", features = ["test-support"] }
webagent-context-assets={path="crates/context-assets"}
webagent-capability-context={path="crates/capability-context"}
webagent-provider-projection={path="crates/provider-projection"}
webagent-background-dispatch={path="crates/background-dispatch"}
webagent-context-assembly = {path="crates/context-assembly"}
http-body-util = "0.1"

[[bin]]
name = "webagent-boot-host"
path = "src/boot_host_main.rs"

[[bin]]
name = "webagent-mcp"
path = "src/plugin_packages/mcp/main.rs"

[[bin]]
name = "webagent-diagnostics"
path = "src/plugin_packages/diagnostics/main.rs"

[[bin]]
name = "webagent-optimization"
path = "src/plugin_packages/optimization/main.rs"

[[bin]]
name = "webagent-outbound-notifications"
path = "src/plugin_packages/outbound_notifications/main.rs"
