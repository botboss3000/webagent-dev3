<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAgent</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece8; --muted: #9a9a94; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { height: 100%; display: grid; place-content: center; text-align: center; padding: 0 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
    display: inline-block; margin: 0 3px; animation: pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  p { color: var(--muted); margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <p id="status">Starting WebAgent…</p>
</main>
</body>
</html>
