[package]
name = "webagent-module-service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
webagent-engine-service = { path = "../engine-service" }
webagent-module-interface = { path = "../module-interface" }
libc = "0.2"

[lints]
workspace = true
