[package]
name = "webagent-models-service"
version = "0.1.0"
edition = "2021"
description = "The model-discovery module service process for dev builds."

[dependencies]
webagent-module-service = { path = "../module-service" }
webagent-models = { path = "../modules/models" }
webagent-model-discovery = { path = "../model-discovery" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }

[lints]
workspace = true
