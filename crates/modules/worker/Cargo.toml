[package]
name = "webagent-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
