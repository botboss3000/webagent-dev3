[package]
name = "webagent-accounts"
version = "0.1.0"
edition = "2021"

[dependencies]
webagent-configuration = { path = "../configuration" }
axum = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
aes-gcm = "0.10"
