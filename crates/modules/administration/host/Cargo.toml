[package]
name = "webagent-administration-host"
version = "0.1.0"
edition = "2021"

# Administration over the shared host core: the Administrator tool handlers, session
# notices and artifacts, source promotion, build dashboard broker calls, the renewal and
# repository watchers and the installation service setting. Run authority, live tool
# decisions, sessions and the worker/broker sockets belong to other modules and come
# through `AdministrationHost`, which the root implements. Routes stay in the root.
[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
webagent-access = { path = "../../access" }
webagent-accounts-host = { path = "../../accounts/host" }
webagent-administration = { path = ".." }
webagent-host-core = { path = "../../../host-core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
webagent-host-core = { path = "../../../host-core", features = ["test-support"] }

[lints]
workspace = true
