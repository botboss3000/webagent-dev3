[package]
name = "webagent-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["linked-context"]
linked-context = ["webagent-context/linked-context", "dep:webagent-context-assembly", "dep:webagent-background-dispatch", "dep:webagent-boot-supervisor", "dep:webagent-context-assets", "dep:webagent-capability-context", "dep:webagent-provider-projection"]
live-context = ["webagent-context/live-context"]
test-support = ["webagent-context/test-support", "webagent-models/test-support"]

[dependencies]
anyhow = "1"
serde = {version="1",features=["derive"]}
serde_json = "1"
tokio = {version="1",features=["full"]}
tokio-util = "0.7"
fs2 = "0.4"
tempfile = "3"
sqlx = {version="0.8",default-features=false,features=["runtime-tokio","sqlite"]}
uuid = {version="1",features=["v4"]}
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tracing = "0.1"
webagent-access = {path="../access"}
webagent-models = {path="../models"}
webagent-configuration = {path="../configuration"}
webagent-context = {path="../context",default-features=false}
webagent-context-contracts = {path="../../context-contracts"}
webagent-background-contracts = {path="../../background-contracts"}
webagent-boot-contracts = {path="../../boot-contracts"}
webagent-assets-contracts = {path="../../assets-contracts"}
webagent-capability-contracts = {path="../../capability-contracts"}
webagent-provider-contracts = {path="../../provider-contracts"}
webagent-context-assembly = {path="../../context-assembly",optional=true}
webagent-background-dispatch = {path="../../background-dispatch",optional=true}
webagent-boot-supervisor = {path="../../boot-supervisor",optional=true}
webagent-context-assets = {path="../../context-assets",optional=true}
webagent-capability-context = {path="../../capability-context",optional=true}
webagent-provider-projection = {path="../../provider-projection",optional=true}

[dev-dependencies]
webagent-context = {path="../context",default-features=false,features=["test-support"]}
webagent-models = {path="../models",features=["test-support"]}
aes-gcm = "0.10"
webagent-context-assembly = {path="../../context-assembly"}
webagent-background-dispatch = {path="../../background-dispatch"}
webagent-boot-supervisor = {path="../../boot-supervisor"}
webagent-context-assets = {path="../../context-assets"}
webagent-capability-context = {path="../../capability-context"}
webagent-provider-projection = {path="../../provider-projection"}
