[package]
name = "webagent-files"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "=0.22.1"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
webagent-chat = { path = "../chat" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
