[package]
name = "webagent-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
webagent-access = { path = "../access" }
webagent-configuration = { path = "../configuration" }
webagent-models = { path = "../models" }

[dev-dependencies]
aes-gcm = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
