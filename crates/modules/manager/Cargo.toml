[package]
name = "webagent-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2="0.4"
tempfile="3"
sqlx={version="0.8",default-features=false,features=["runtime-tokio","sqlite"]}
uuid={version="1",features=["v4"]}
tokio={version="1",features=["full"]}
tokio-util="0.7"
futures-util="0.3"
tracing="0.1"
webagent-models={path="../models"}
webagent-provider-contracts={path="../../provider-contracts"}

[dev-dependencies]
webagent-models={path="../models",features=["test-support"]}
webagent-access={path="../access"}
webagent-provider-projection={path="../../provider-projection"}
axum="0.8"
aes-gcm="0.10"
