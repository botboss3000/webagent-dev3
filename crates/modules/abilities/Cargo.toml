[package]
name="webagent-abilities"
version="0.1.0"
edition="2021"

[features]
default=[]
test-support=["dep:tempfile"]

[dependencies]
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
hex="0.4"
sqlx={version="0.8",default-features=false,features=["runtime-tokio","sqlite"]}
webagent-access={path="../access"}
webagent-configuration={path="../configuration"}
webagent-extensions={path="../extensions"}
webagent-context-contracts={path="../../context-contracts"}
webagent-capability-contracts={path="../../capability-contracts"}
tempfile={version="3",optional=true}

[dev-dependencies]
tempfile="3"
tokio={version="1",features=["full"]}
aes-gcm="0.10"
rand="0.8"
