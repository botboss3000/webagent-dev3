[package]
name = "webagent-diagnostics"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
path = "lib.rs"

[features]
test-support = []

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
tracing = "0.1"
webagent-context = { path = "../../../crates/modules/context", default-features = false }
webagent-configuration = { path = "../../../crates/modules/configuration" }
webagent-models = { path = "../../../crates/modules/models" }

[dev-dependencies]
aes-gcm = "0.10"
rand = "0.8"
tempfile = "3"
http-body-util = "0.1"
