[package]
name = "webagent-mcp"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
axum = "=0.8.9"
tempfile = "=3.27.0"
futures-util = "=0.3.34"

[[bin]]
name = "webagent-mcp"
path = "main.rs"
